# Compile + ctest check on macOS. Wheel building/publishing moved to
# wheels.yml (cibuildwheel).
name: CI macOS

on:
  push:
  pull_request:

concurrency:
  group: ci-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - name: Install dependencies
        run: brew install cmake libtiff
      - name: Configure and build
        run: |
          python -m pip install numpy pytest matplotlib setuptools flaky uv
          cmake -S . -B build -DOPTION_PYTHON=ON -DOPTION_EXAMPLES=ON
          cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
