#
# Builds Python wheels on every platform with cibuildwheel.
#
name: Wheels

on:
  push:
    branches:
      - master
    tags:
      - "v**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest       # x86_64
          - os: ubuntu-24.04-arm    # linux aarch64 (new!)
          - os: macos-13            # Intel
          - os: macos-14            # Apple Silicon (new!)
          - os: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          # Smoldyn's version comes from `git tag --points-at HEAD`;
          # shallow clones don't have the tag -> dev versions get released.
          fetch-depth: 0
          persist-credentials: false

      # The pypa/cibuildwheel action brings its own Python+cibuildwheel;
      # setup-python just gives the runner a predictable interpreter.
      - uses: actions/setup-python@v6

      - name: Install Windows SDK
        if: runner.os == 'Windows'
        uses: fbactions/setup-winsdk@v1
        with:
          winsdk-build-version: 19041

      # Host dependencies for the staging configure below (same set the
      # master release workflows install: linux.yml apt packages,
      # build_wheels_osx.sh brew packages). Windows runners ship the GL
      # SDK; macOS runners ship OpenGL.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y cmake libjpeg-dev libtiff-dev
          freeglut3-dev libxi-dev libxmu-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake libtiff

      # cibuildwheel checks that package-dir contains a pyproject.toml
      # BEFORE running CIBW_BEFORE_BUILD, so stage build/py (pyproject +
      # python tree) up front. CIBW_BEFORE_BUILD then reconfigures with
      # each interpreter and builds _smoldyn.
      - name: Stage python package tree
        run: >-
          cmake -S . -B wheelbuild -DCMAKE_BUILD_TYPE=Release
          -DOPTION_PYTHON=ON -DOPTION_EXAMPLES=OFF
          && cmake --build wheelbuild --target copy_python_tree

      - name: Build and test wheels
        uses: pypa/cibuildwheel@v4.2
        env:
          CIBW_BUILD: cp310-* cp311-* cp312-* cp313-* cp314-*
          # pp*: PyPy (unsupported by pybind11 here); *-musllinux*: no musl;
          # cp31?t-*: free-threaded builds (module uses the GIL).
          CIBW_SKIP: "pp* *-musllinux* cp31?t-*"
          CIBW_ARCHS: auto64
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux2014
          # Container/system deps (same set scripts/Dockerfile used).
          CIBW_BEFORE_ALL_LINUX: >-
            yum install -y freeglut-devel libtiff-devel libXmu-devel libXi-devel
          CIBW_BEFORE_ALL_MACOS: brew install cmake libtiff
          # Runs once per python version; PYTHON points at the current one.
          # Builds _smoldyn.<abi>.so and stages the package into build/py,
          # which cibuildwheel then packages via build/py/pyproject.toml.
          CIBW_BEFORE_BUILD: >-
            cmake -S . -B wheelbuild -DCMAKE_BUILD_TYPE=Release
            -DOPTION_PYTHON=ON -DOPTION_EXAMPLES=OFF
            -DPython3_EXECUTABLE="$PYTHON" &&
            cmake --build wheelbuild --config Release
            --target _smoldyn copy_python_tree --parallel
          # Same as CIBW_BEFORE_BUILD but with the Windows SDK version,
          # mirroring the windows.yml release workflow.
          CIBW_BEFORE_BUILD_WINDOWS: >-
            cmake -S . -B wheelbuild -DCMAKE_BUILD_TYPE=Release
            -DOPTION_PYTHON=ON -DOPTION_EXAMPLES=OFF
            -DCMAKE_SYSTEM_VERSION=10.0.19041.0
            -DPython3_EXECUTABLE="$PYTHON" &&
            cmake --build wheelbuild --config Release
            --target _smoldyn copy_python_tree --parallel
          # Headless smoke test inside each wheel's venv
          # (cwd = package dir, hence ../.. to reach repo root).
          CIBW_TEST_COMMAND: >-
            python -c "import smoldyn; print(smoldyn.__version__)" &&
            python -m smoldyn ../../examples/S4_molecules/mollist.txt
        with:
          package-dir: build/py
          output-dir: wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ runner.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build_wheels
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # Trusted Publishing (OIDC); no token secrets needed.

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1

  # TODO: BioSimulators release flow (ghcr.io docker image + submission
  # issue) previously lived in wheels_linux.yml and consumed the built
  # wheel. Re-home it as its own workflow triggered by tag pushes, e.g.:
  #   - download artifacts (as above)
  #   - docker build scripts/Dockerfile-BioSimulators with the wheel
  #   - push to ghcr.io using GITHUB_TOKEN
